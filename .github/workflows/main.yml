name: ACEest CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and lint
        run: |
          python -m compileall -q app.py services.py tests
          python -m ruff check --select E9,F63,F7,F82 app.py services.py tests
      - name: Assemble Docker image
        run: docker build -t aceest-ci .
      - name: Test inside Docker
        run: docker run --rm aceest-ci python -m pytest -q -p no:cacheprovider
